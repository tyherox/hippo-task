name: Scorecard link check

# HEADs every vendor-doc URL cited in the scorecard YAMLs once a week
# plus on-demand. Deliberately NOT in the PR-gating scorecard workflow
# because network reachability is flaky — false positives would block
# merges. A failing run here means a citation has gone stale; fix the
# YAML and open a patch audit.

on:
  schedule:
    # Monday 14:00 UTC
    - cron: "0 14 * * 1"
  workflow_dispatch:

jobs:
  check-links:
    name: Check citation URLs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check citation URLs
        run: pnpm scorecard:check-links
